<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203B35" />
    <meta name="application-name" content="Dog-eard" />
    <meta name="apple-mobile-web-app-title" content="Dog-eard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      type="image/x-icon"
      href="%BASE_URL%favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
      sizes="any"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta
      name="google-site-verification"
      content="ssHwYMZcdgcP0mIeo3FqUMjQAwkmJn5j2pzSYdgpV_0"
    />
    <meta
      name="description"
      content="dog-eard — a private home for the words that stay with you."
    />
    <title>dog-eard — Keep the words that stay with you.</title>
    <style>
      body {
        margin: 0;
      }
      .app-startup {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 16px;
        margin: 0;
        background: #f5f0e6;
        color: #203b35;
        font:
          16px/1.65 system-ui,
          sans-serif;
        text-align: center;
      }
      .app-startup strong {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        letter-spacing: -0.08em;
        white-space: nowrap;
        font:
          bold 32px Georgia,
          serif;
      }
      .app-startup .wordmark-hyphen {
        display: inline-block;
        letter-spacing: 0;
        margin-inline: 0.06em;
      }
      .app-startup .wordmark-dot {
        color: #96713d;
      }
      .startup-spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        vertical-align: middle;
        border: 2px solid #dedbce;
        border-top-color: #203b35;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-startup .wordmark-logo {
        display: block;
        width: 48px;
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-startup" role="main">
        <strong>
          <img
            class="wordmark-logo"
            src="%BASE_URL%dogeard-logo.svg"
            width="48"
            height="28"
            alt=""
            aria-hidden="true"
          />
          <span
            >dog<span class="wordmark-hyphen">&#8208;</span>eard<span
              class="wordmark-dot"
              >.</span
            ></span
          >
        </strong>
        <div role="status">
          <span class="startup-spinner" aria-hidden="true"></span>
          Opening dog-eard…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
